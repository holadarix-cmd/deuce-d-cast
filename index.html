<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Deuce D · CAST</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body>
  <div id="viewport">
    <div id="stage" aria-label="Marcador Deuce D">
      <img id="staticBase" src="assets/cast_static_base.png" alt="" />

      <div id="players"></div>
      <div id="score"></div>
      <div id="progress"></div>

      <div id="gamesA" class="counter games-counter team-a">0</div>
      <div id="gamesB" class="counter games-counter team-b">0</div>
      <div id="setsA" class="counter sets-counter team-a">0</div>
      <div id="setsB" class="counter sets-counter team-b">0</div>

      <div id="clock" aria-label="Hora actual">00:00</div>
      <img id="serverBall" src="assets/server_ball.png" alt="Saca" />
    </div>
  </div>

  <audio id="castAudio" preload="auto"></audio>
  <script src="receiver.js"></script>
</body>
</html>
